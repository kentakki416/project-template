## TODO: container_name と DB_NAME の "project-template" 部分をプロジェクト名に変更してください
services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: project-template-postgres # TODO: プロジェクト名に変更
    restart: unless-stopped
    environment:
      POSTGRES_DB: project-template_dev # TODO: プロジェクト名に変更（DB名はアンダースコア推奨）
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      TZ: Asia/Tokyo
    ports:
      # 既定 5432 は他プロジェクトの Postgres と衝突するため 5433 をローカル既定にする
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: project-template-redis # TODO: プロジェクト名に変更
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      # 既定 6379 は他プロジェクトの Redis と衝突するため 6380 をローカル既定にする
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: project-template-clickhouse # TODO: プロジェクト名に変更
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: project_template
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: password
      # 開発用。本番は IAM / ネットワーク側で絞る
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      # 既定 8123 / 9000 は他プロジェクトと衝突しうるためずらす
      - '${CLICKHOUSE_HTTP_PORT:-8124}:8123'
      - '${CLICKHOUSE_NATIVE_PORT:-9003}:9000'
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # localhost だとコンテナ内で ::1 に解決されるが ClickHouse は IPv4 のみ listen するため
      # 127.0.0.1 を明示する
      test: ['CMD', 'wget', '--spider', '-q', '127.0.0.1:8123/ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  clickhouse_data:
    driver: local

networks:
  app-network:
    driver: bridge
