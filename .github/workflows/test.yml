name: Test

on:
  # main への push（マージ後）のみ。feature ブランチは pull_request 側で走らせ、
  # push + pull_request が同一 concurrency group に入って相互キャンセルするのを防ぐ。
  push:
    branches: [main]
  # paths フィルタは付けない。required status check にした場合、対象外の変更で
  # skip されると「保留 / 失敗」表示のまま merge がブロックされるため、常に実行して
  # 必ず結果を報告する。
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true # 同一グループのワークフローが実行中ならキャンセル

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: project-template_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # PR の base との差分でテスト対象を絞るため全履歴が必要。
          # 浅い clone だと base の commit が無く diff が取れない。
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter "./packages/*" build

      # テストは turbo の test:ci タスクに統一している。api だけ `test` が dotenvx で
      # .env.local を復号するため（CI に復号鍵は無い）、CI 用のタスクを分けている。
      #
      # PR では影響範囲だけを実行してランナー時間を削る。ただし turbo の
      # `--filter=...[ref]` は **パッケージに属さないファイルの変更で 0 件を返す**。
      # workflow / docker-compose / infra を変えたときにテストが 1 件も走らないまま
      # 緑になるため、それらの変更は全実行に倒す。
      - name: Run tests
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"

          # パッケージ外だが全テストに影響しうるパス
          GLOBAL_PATHS='^(\.github/|turbo\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|docker-compose\.yaml|infra/)'

          if [ -z "$BASE" ]; then
            echo "::notice::main への push / 手動実行のため全テストを実行する"
            pnpm turbo run test:ci
          elif git diff --name-only "$BASE...HEAD" | grep -qE "$GLOBAL_PATHS"; then
            echo "::notice::パッケージ外の変更を検出したため全テストを実行する"
            pnpm turbo run test:ci
          else
            echo "::notice::影響範囲のみ実行する (base=$BASE)"
            pnpm turbo run test:ci --filter="...[$BASE]"
          fi
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/project-template_test
          REDIS_URL: redis://localhost:6379/1
