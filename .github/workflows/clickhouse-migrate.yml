name: ClickHouse Migrate

# =============================================================================
# ClickHouse の migration だけを流す (deploy をやり直さずに)
# =============================================================================
# 使いどころ (手順は packages/data-warehouse/clickhouse/README.md):
# - CDC の対象テーブルを足し、apply で ClickPipe の初回の取り込みが終わった後 (view を作る)
# - ClickPipe を Resync した後 (view を作り直す)
# - Postgres に足した列を view に出す (そのテーブルに書き込みがあった後)
#
# 最後に deploy した migration イメージで起動する。dwh-migration の最新の revision をそのまま
# 起動しないのは、Terraform の apply でできた revision の image が :latest (ECR に無い placeholder) のため。
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - min
          - prd

# 同じ環境の deploy と同時に走らないよう、deploy workflow と同じ group にする
concurrency:
  group: deploy-aws-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1

  # AWS リソースタグ (Terraform default_tags の Project / Environment と一致させる)
  PROJECT_NAME: project-template
  ENVIRONMENT: ${{ inputs.environment }}

  ECS_CLUSTER: project-template-${{ inputs.environment }}-cluster
  ECS_MIGRATION_TASK_DEF: project-template-${{ inputs.environment }}-migration
  ECS_DWH_MIGRATION_TASK_DEF: project-template-${{ inputs.environment }}-dwh-migration
  DATA_WAREHOUSE_SECRET_ID: /project-template-${{ inputs.environment }}/data-warehouse

  # VPC リソース解決用 (Terraform 側 modules/vpc の Name タグと一致)。
  # dev / prd のタスクは private subnet から NAT 経由で、min は public subnet から public IP で外に出る
  ECS_SECURITY_GROUP_NAME: project-template-${{ inputs.environment }}-ecs
  SUBNET_NAME_PREFIX: project-template-${{ inputs.environment }}-${{ inputs.environment == 'min' && 'public' || 'private' }}
  ASSIGN_PUBLIC_IP: ${{ inputs.environment == 'min' && 'ENABLED' || 'DISABLED' }}

jobs:
  migrate-dwh:
    name: Run ClickHouse Migration (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4 # composite action を使うため

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # deploy の detect と同じ判定。ClickHouse の無い環境では何もせずに失敗する
      - name: Check data warehouse secret
        run: |
          if ! OUTPUT=$(aws secretsmanager describe-secret --secret-id "${DATA_WAREHOUSE_SECRET_ID}" --query Name --output text 2>&1); then
            echo "${OUTPUT}" >&2
            echo "::error::${DATA_WAREHOUSE_SECRET_ID} not found. ClickHouse is not enabled in ${ENVIRONMENT} (enable_data_warehouse = false)"
            exit 1
          fi

      # deploy は毎回 Drizzle の migration のタスク定義に SHA タグのイメージを register する。
      # ClickHouse の migration も同じイメージなので、その revision を新しい順に見て :latest でない最初の image を使う
      - name: Find the last deployed migration image
        id: image
        run: |
          set -euo pipefail
          for ARN in $(aws ecs list-task-definitions \
            --family-prefix "${ECS_MIGRATION_TASK_DEF}" \
            --status ACTIVE \
            --sort DESC \
            --query 'taskDefinitionArns' \
            --output text); do
            IMAGE=$(aws ecs describe-task-definition \
              --task-definition "${ARN}" \
              --query 'taskDefinition.containerDefinitions[0].image' \
              --output text)
            if [[ "${IMAGE}" != *:latest ]]; then
              echo "Last deployed migration image: ${IMAGE} (${ARN})"
              echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::No deployed migration image found. Run the deploy workflow for ${ENVIRONMENT} first"
          exit 1

      # Terraform output や GitHub Secrets で固定化せず、AWS リソースのタグから動的に解決する
      - name: Resolve network configuration from tags
        id: network
        run: |
          set -euo pipefail

          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Project,Values=${PROJECT_NAME}" "Name=tag:Environment,Values=${ENVIRONMENT}" \
            --query 'Vpcs[0].VpcId' --output text)

          if [ -z "${VPC_ID}" ] || [ "${VPC_ID}" = "None" ]; then
            echo "::error::VPC not found (tag:Project=${PROJECT_NAME} tag:Environment=${ENVIRONMENT})"
            exit 1
          fi

          SUBNETS=$(aws ec2 describe-subnets \
            --filters "Name=vpc-id,Values=${VPC_ID}" "Name=tag:Name,Values=${SUBNET_NAME_PREFIX}*" \
            --query 'Subnets[*].SubnetId' --output text | tr '\t' ',')

          ECS_SG=$(aws ec2 describe-security-groups \
            --filters "Name=vpc-id,Values=${VPC_ID}" "Name=tag:Name,Values=${ECS_SECURITY_GROUP_NAME}" \
            --query 'SecurityGroups[0].GroupId' --output text)

          if [ -z "${SUBNETS}" ] || [ -z "${ECS_SG}" ] || [ "${ECS_SG}" = "None" ]; then
            echo "::error::Failed to resolve subnets or security group (VPC=${VPC_ID} subnets='${SUBNETS}' sg='${ECS_SG}')"
            exit 1
          fi

          echo "Resolved: VPC=${VPC_ID} subnets=${SUBNETS} ecs_sg=${ECS_SG}"
          echo "subnets=${SUBNETS}" >> "$GITHUB_OUTPUT"
          echo "ecs_security_group=${ECS_SG}" >> "$GITHUB_OUTPUT"

      - name: Run ClickHouse migration
        uses: ./.github/actions/run-one-shot-task
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          task-definition: ${{ env.ECS_DWH_MIGRATION_TASK_DEF }}
          image: ${{ steps.image.outputs.image }}
          subnets: ${{ steps.network.outputs.subnets }}
          security-group: ${{ steps.network.outputs.ecs_security_group }}
          assign-public-ip: ${{ env.ASSIGN_PUBLIC_IP }}
